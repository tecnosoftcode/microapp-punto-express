<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobro Express - Punto Multidivisa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-4">

    <!-- Header / Branding -->
    <header class="w-full max-w-md bg-white rounded-2xl shadow-sm p-4 mb-4 flex justify-between items-center border border-slate-200">
        <div>
            <h1 id="business-name" class="font-bold text-lg text-slate-900">Cargando...</h1>
            <p class="text-xs text-slate-500">Calculadora de Cobro & Vuelto</p>
        </div>
        <div class="text-right">
            <label class="block text-xs font-semibold text-slate-500">Tasa del día (BS/$):</label>
            <input type="number" id="exchange-rate" class="w-24 text-right font-bold text-slate-800 border border-slate-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none" step="0.01">
        </div>
    </header>

    <!-- App Main Box -->
    <main class="w-full max-w-md bg-white rounded-2xl shadow-md p-5 border border-slate-200 space-y-4">
        
        <!-- Total Venta -->
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Monto Total de la Venta ($)</label>
            <input type="number" id="total-usd" placeholder="0.00" class="w-full text-3xl font-extrabold text-blue-600 border-2 border-blue-200 rounded-xl p-3 focus:border-blue-600 outline-none">
            <p id="total-bs-text" class="text-xs text-slate-500 mt-1 text-right">Eq: 0.00 BS</p>
        </div>

        <hr class="border-slate-100">

        <!-- Pagos Recibidos -->
        <div class="space-y-3">
            <h2 class="text-sm font-bold text-slate-700">Desglose de Pago Recibido:</h2>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-500 block">Efectivo ($):</label>
                    <input type="number" id="pay-usd" placeholder="0.00" class="pay-input w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-500 block">Pago Móvil / Transf (BS):</label>
                    <input type="number" id="pay-pm-bs" placeholder="0.00" class="pay-input w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-500 block">Efectivo (BS):</label>
                    <input type="number" id="pay-cash-bs" placeholder="0.00" class="pay-input w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-500 block">Otros / Zelle ($):</label>
                    <input type="number" id="pay-zelle-usd" placeholder="0.00" class="pay-input w-full border rounded-lg p-2 text-sm">
                </div>
            </div>
        </div>

        <!-- Panel de Vuelto / Saldo -->
        <div id="result-box" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
            <span class="text-xs font-semibold text-slate-500 block uppercase">Estado de la cuenta</span>
            <div id="status-text" class="text-xl font-bold text-slate-700 mt-1">Ingrese Montos</div>
            <div id="vuelto-details" class="text-sm text-slate-600 mt-1"></div>
        </div>

        <!-- Botones de Acción -->
        <div class="grid grid-cols-2 gap-2 pt-2">
            <button id="btn-reset" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">
                Limpiar
            </button>
            <button id="btn-send-whatsapp" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-1">
                Recibo WhatsApp
            </button>
        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
